name: Codex 8AM Trigger

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00
    - cron: "0 21 * * *"

  # 允许手动测试
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Restore ChatGPT login
        env:
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
        run: |
          mkdir -p ~/.codex
          echo "$CODEX_AUTH_JSON_B64" | base64 -d > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json

      - name: Check login
        run: codex login status

      - name: Trigger Codex
        run: |
          unset OPENAI_API_KEY
          unset CODEX_API_KEY
          codex exec --skip-git-repo-check "Reply only with OK"
